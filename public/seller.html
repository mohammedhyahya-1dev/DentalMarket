<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seller Profile — DentalMarket</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 420px;
    margin: 0 auto;
    padding: 64px 24px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
    text-align: center;
  }
  .logo {
    font-size: 24px;
    font-weight: 700;
    color: #6366F1;
    margin-bottom: 32px;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  p {
    font-size: 15px;
    color: #555;
    margin-bottom: 28px;
  }
  a.button {
    display: block;
    background: #6366F1;
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="logo">DentalMarket</div>
  <h1>You've been sent to a seller's shop</h1>
  <p>Open this link in the DentalMarket app to see their listings, ratings, and followers.</p>
  <!-- If Android App Links verification isn't currently set up for this
       domain (see the SHA-256/assetlinks.json note in the code review this
       page came out of), the OS may hand a visitor here even with the app
       installed — this gives them a second, manual way to open it instead
       of being stuck on a static page with no path forward. intent:// is
       Android-only; other platforms just see this as an inert button.
       href is set from the actual visited path (/seller/{uid}) below,
       since this one static file serves every seller via firebase.json's
       wildcard rewrite — a hardcoded path would send everyone to the same
       seller regardless of which link they actually opened. -->
  <a class="button" id="open-app" href="#">
    Open in DentalMarket
  </a>
  <!-- Not a link: com.dentalmarket.app was never published under this
       project's own account, so that package id currently belongs to an
       unrelated third-party app on the real Play Store. Linking it would
       have sent anyone without the app to install someone else's software
       believing it was DentalMarket. Replace with a real store link once
       this app is actually published under its own account. -->
  <p>The DentalMarket app isn't available in app stores yet — ask the person who shared this link to help you install it directly.</p>
  <script>
    // S.browser_fallback_url matters here for the same reason the removed
    // link above did: without an explicit fallback, Chrome's own intent://
    // handling falls back to https://play.google.com/store/apps/details
    // ?id={package} whenever the app can't be resolved — synthesized from
    // the package= value right below, not anything visible in this file.
    // Pointing it at this same page keeps a failed resolution landing on
    // the "isn't available in app stores yet" message above instead.
    document.getElementById('open-app').href =
      'intent://' + window.location.host + window.location.pathname +
      '#Intent;scheme=https;package=com.dentalmarket.app;S.browser_fallback_url=' +
      encodeURIComponent(window.location.href) + ';end';
  </script>
</body>
</html>
